name: Build tokens

on:
  push:
    paths:
      - 'packages/tokens/src/figma/**'
      - 'packages/tokens/src/tokens.json'
    branches:
      - main

jobs:
  build-tokens:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Convert Figma tokens to DTCG
        run: pnpm --filter @collective-discovery/tokens convert

      - name: Build Style Dictionary outputs
        run: pnpm --filter @collective-discovery/tokens build

      - name: Commit built outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/tokens/src/tokens.json packages/tokens/dist
          git diff --staged --quiet || git commit -m "chore(tokens): rebuild from Figma export [skip ci]"
          git push
